name: Docker Frontend

on:
  push:
    tags:
      - "v*"
    branches: ["main"]
    paths:
      - "src/programmable-tokens-frontend/**"
      - "src/programmable-tokens-offchain-java/src/main/resources/protocol-bootstraps-*.json"
      - ".github/workflows/docker-frontend.yml"
  workflow_dispatch:
    inputs:
      networks:
        description: "Networks to build"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - preview
          - preprod
          - mainnet

env:
  DOCKER_REPO: cardanofoundation/cip113-frontend

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # ⚑ mainnet IS in the matrix but is DISPATCH-ONLY: the gate below skips it on push.
        # A push to main must not publish a mainnet-targeted image on its own, and today there is
        # no mainnet deployment for one to talk to (no protocol-bootstraps-mainnet.json).
        network: [preview, preprod, mainnet]
        include:
          - network: preview
            blockfrost_url: https://cardano-preview.blockfrost.io/api/v0
            api_base_url_default: https://preview-indexer.programmabletokens.xyz
          - network: preprod
            blockfrost_url: https://cardano-preprod.blockfrost.io/api/v0
            api_base_url_default: https://preprod-indexer.programmabletokens.xyz
          - network: mainnet
            blockfrost_url: https://cardano-mainnet.blockfrost.io/api/v0
            # ⛔ NO DEFAULT ON PURPOSE. NEXT_PUBLIC_* is inlined at BUILD time, so whatever goes
            # here is permanent in the image and cannot be changed by k8s. There is no mainnet
            # indexer yet — `mainnet-indexer.programmabletokens.xyz` does not resolve and
            # `indexer.programmabletokens.xyz` answers a bare router 404 — so any value written
            # here would be a guess baked into a published artefact. The step below REFUSES an
            # empty resolution rather than falling back to the frontend's own
            # `http://localhost:8080` default. Set the repo variable
            # NEXT_PUBLIC_API_BASE_URL_MAINNET when the indexer exists.
            api_base_url_default: ""

    steps:
      - name: Skip if network not selected
        id: gate
        run: |
          requested="${{ github.event.inputs.networks }}"
          # mainnet never builds from a push, and not from `all` either: it must be asked for by
          # name, so publishing a mainnet image is always a deliberate act.
          if [ "${{ matrix.network }}" = "mainnet" ] && [ "$requested" != "mainnet" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$requested" ] && [ "$requested" != "all" ] && [ "$requested" != "${{ matrix.network }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.skip == 'false'
        with:
          fetch-depth: 0  # required for git describe --tags

      - name: Compute version tag
        if: steps.gate.outputs.skip == 'false'
        id: version
        working-directory: src/programmable-tokens-frontend
        run: |
          GIT_TAG=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          echo "git_tag=${GIT_TAG}" >> "$GITHUB_OUTPUT"
          echo "Version: ${GIT_TAG}-${{ matrix.network }}"

      - name: Resolve API base URL
        if: steps.gate.outputs.skip == 'false'
        id: urls
        run: |
          case "${{ matrix.network }}" in
            preview) api="${{ vars.NEXT_PUBLIC_API_BASE_URL_PREVIEW }}" ; base="${{ vars.NEXT_PUBLIC_BASE_URL_PREVIEW }}" ;;
            preprod) api="${{ vars.NEXT_PUBLIC_API_BASE_URL_PREPROD }}" ; base="${{ vars.NEXT_PUBLIC_BASE_URL_PREPROD }}" ;;
            mainnet) api="${{ vars.NEXT_PUBLIC_API_BASE_URL_MAINNET }}" ; base="${{ vars.NEXT_PUBLIC_BASE_URL_MAINNET }}" ;;
          esac
          [ -z "$api" ] && api="${{ matrix.api_base_url_default }}"
          # An empty value here is not a soft default: the frontend falls back to
          # http://localhost:8080, which is ALSO where the devkit serves, and NEXT_PUBLIC_* cannot
          # be changed after the build. Fail instead of publishing an image that points at itself.
          if [ -z "$api" ]; then
            echo "::error::No API base URL for ${{ matrix.network }}. Set the repository variable NEXT_PUBLIC_API_BASE_URL_<NETWORK> (upper-case) or give the matrix an api_base_url_default. Refusing to build: an empty value bakes http://localhost:8080 into the image."
            exit 1
          fi
          echo "api_base_url=${api}" >> "$GITHUB_OUTPUT"
          echo "base_url=${base}" >> "$GITHUB_OUTPUT"

      - name: Resolve Blockfrost API key
        if: steps.gate.outputs.skip == 'false'
        id: secrets
        env:
          BLOCKFROST_PREVIEW_API_KEY: ${{ secrets.BLOCKFROST_PREVIEW_API_KEY }}
          BLOCKFROST_PREPROD_API_KEY: ${{ secrets.BLOCKFROST_PREPROD_API_KEY }}
          BLOCKFROST_MAINNET_API_KEY: ${{ secrets.BLOCKFROST_MAINNET_API_KEY }}
        run: |
          case "${{ matrix.network }}" in
            preview) key="$BLOCKFROST_PREVIEW_API_KEY" ;;
            preprod) key="$BLOCKFROST_PREPROD_API_KEY" ;;
            mainnet) key="$BLOCKFROST_MAINNET_API_KEY" ;;
          esac
          if [ -z "$key" ]; then
            echo "::error::Blockfrost API key for ${{ matrix.network }} is not set"
            exit 1
          fi
          echo "::add-mask::$key"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
        if: steps.gate.outputs.skip == 'false'

      - name: Login to Docker Hub
        if: steps.gate.outputs.skip == 'false'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.HUB_DOCKER_COM_USER }}
          password: ${{ secrets.HUB_DOCKER_COM_PASS }}

      - name: Build and push
        if: steps.gate.outputs.skip == 'false'
        uses: docker/build-push-action@v6
        with:
          context: src/programmable-tokens-frontend
          file: src/programmable-tokens-frontend/Dockerfile
          build-contexts: |
            deployment-records=src/programmable-tokens-offchain-java/src/main/resources
          push: true
          tags: |
            ${{ env.DOCKER_REPO }}:${{ steps.version.outputs.git_tag }}-${{ matrix.network }}
            ${{ env.DOCKER_REPO }}:${{ matrix.network }}
          build-args: |
            NEXT_PUBLIC_NETWORK=${{ matrix.network }}
            NEXT_PUBLIC_BLOCKFROST_API_KEY=${{ steps.secrets.outputs.key }}
            NEXT_PUBLIC_BLOCKFROST_URL=${{ matrix.blockfrost_url }}
            NEXT_PUBLIC_API_BASE_URL=${{ steps.urls.outputs.api_base_url }}
            NEXT_PUBLIC_BASE_URL=${{ steps.urls.outputs.base_url }}
          cache-from: type=gha,scope=frontend-${{ matrix.network }}
          cache-to: type=gha,scope=frontend-${{ matrix.network }},mode=max

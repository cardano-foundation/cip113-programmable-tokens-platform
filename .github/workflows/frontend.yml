name: Frontend

on:
  push:
    branches: ["main", "develop"]
    paths:
      - "src/programmable-tokens-frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "src/programmable-tokens-frontend/**"
      - ".github/workflows/frontend.yml"

defaults:
  run:
    working-directory: src/programmable-tokens-frontend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: src/programmable-tokens-frontend/.nvmrc
          cache: npm
          cache-dependency-path: src/programmable-tokens-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # Runs every `test:*` script in package.json via scripts/run-suites.mjs, which prints a
      # per-suite PASS/FAIL table and the number of suites EXECUTED. Before this step CI ran
      # none of the twenty-one suites, so a green tick said only that the app compiled.
      # The runner exits non-zero if it discovers no suites, so a wiring mistake cannot pass.
      - run: npm test

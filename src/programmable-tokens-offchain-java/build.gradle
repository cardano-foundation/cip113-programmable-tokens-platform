plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.4'
	id 'io.spring.dependency-management' version '1.1.6'
}

group = 'org.cardanofoundation.cip113'
version = '0.0.1-SNAPSHOT'

java {
	sourceCompatibility = '21'
}

repositories {
	mavenCentral()
	mavenLocal()
	maven {
		name = "Central Portal Snapshots"
		url = uri("https://central.sonatype.com/repository/maven-snapshots/")
		content {
			includeModule("id.veridian", "signify")
		}
	}
}

configurations.all {
	resolutionStrategy {
		force 'com.bloxbean.cardano:yaci-core:0.3.9'
	}
}

dependencies {

	implementation 'org.springframework.boot:spring-boot-starter'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'

	implementation 'org.cardanofoundation:cf-cardano-conversions-java:1.2.0'
    implementation 'com.easy1staking:cardano-client-lib-extensions:0.0.2'

	implementation 'com.bloxbean.cardano:yaci-store-spring-boot-starter:0.1.6'
	implementation 'com.bloxbean.cardano:yaci-store-utxo-spring-boot-starter:0.1.6'
	implementation 'com.bloxbean.cardano:yaci-store-staking-spring-boot-starter:0.1.6'

	implementation('com.bloxbean.cardano:cardano-client-lib:0.8.0-pre3')
	implementation('com.bloxbean.cardano:cardano-client-backend-blockfrost:0.8.0-pre3')
	implementation('com.bloxbean.cardano:cardano-client-backend-ogmios:0.8.0-pre3')
	implementation('com.bloxbean.cardano:cardano-client-backend-koios:0.8.0-pre3')

    implementation('com.bloxbean.cardano:cardano-client-merkle-patricia-forestry:0.8.0-pre3')
    implementation('com.bloxbean.cardano:aiken-java-binding:0.1.0')
	implementation('org.scalus:scalus-bloxbean-cardano-client-lib_3:0.10.4')

    implementation('com.easy1staking:cardano-client-lib-extensions:0.0.4')

	implementation 'id.veridian:signify:0.1.2-66227de-SNAPSHOT'

	// Version comes from the Spring Boot BOM (io.spring.dependency-management), NOT from
	// a dynamic `latest.release`.
	//
	// `latest.release` resolved micrometer-registry-prometheus 1.18.0-M1 — a MILESTONE,
	// which Gradle happily treats as a release — while the Boot 3.3.4 BOM pins
	// prometheus-metrics-exposition-formats to 1.2.1. The milestone calls
	// ExpositionFormats.init(PrometheusProperties), which does not exist in 1.2.1, so the
	// app died at startup with NoSuchMethodError while every test stayed green: the
	// Prometheus registry is only constructed when the context boots.
	//
	// A dynamic version also means the build is not reproducible — it can break with no
	// local change, purely because someone published a new version. That is what happened
	// here. Let the BOM decide, so the registry and the client are always the pair Boot
	// tested together.
	implementation 'io.micrometer:micrometer-registry-prometheus'

	implementation 'org.postgresql:postgresql:42.6.0'
	testImplementation 'com.h2database:h2:2.1.214'

	compileOnly 'com.bloxbean.cardano:cardano-client-annotation-processor:0.8.0-pre3'
	annotationProcessor 'com.bloxbean.cardano:cardano-client-annotation-processor:0.8.0-pre3'

	// Lombok
	compileOnly 'org.projectlombok:lombok:1.18.38'
	annotationProcessor 'org.projectlombok:lombok:1.18.38'

	testCompileOnly 'org.projectlombok:lombok:1.18.38'
	testAnnotationProcessor 'org.projectlombok:lombok:1.18.38'

}

// ============================ CI TEST TASK ============================
// ⛔ AN ALLOWLIST, NEVER AN EXCLUSION LIST, and the reason is money. A bare `./gradlew test`
// runs PreviewConstants-driven classes — Preview*, Preprod*, Devnet*, IssueToken, Transfer,
// DirectoryMint, ProtocolParamsMint — which BUILD AND SUBMIT REAL TRANSACTIONS against
// whatever CARDANO_BACKEND_URL points at, from a mnemonic committed in the test sources. They
// are gated by no annotation. That is why the workflow has always passed `-x test`.
//
// An exclusion list gets this wrong exactly once and then CI spends real funds, so the safe
// direction is to name what RUNS. CiTestInventoryTest enforces two things about this list: that
// no submitting class can be matched by it, and that a newly added test class cannot go
// unclassified and silently unrun.
ext.ciTestPatterns = [
		// The offline package, by package: new offline tests land here and are picked up with
		// no edit to this list, which is the only self-maintaining part of this arrangement.
		'org.cardanofoundation.cip113.offline.*',
		// Verified offline and passing, 2026-10-01. Named individually because they predate the
		// offline package convention and live beside network-touching classes.
		'*AddressTest',
		'*ProtocolScriptBuilderServiceHashDerivationTest',
		'*DirectorySetNodeTest',
		'*ProtocolParamsParserTest',
		'*RegistryNodeParserTest',
		'*RegistryNodeRoundTripTest',
		'*IssuancePolicyIdTest',
		'*TransactionDeserializationTest',
		'*Cip68Test',
		'*ConditionalBeanWiringTest',
		'*RegistryCredentialCrossCheckTest',
]

// ---------------------------- QUARANTINE ----------------------------
// Failing on a clean tree since before 2026-08-14 and NOT caused by anything in CI. Excluded so
// the other ~90 tests can run at all: a permanently red check is the noise floor, but `-x test`
// was worse — it made every passing test invisible, so nothing prompted the question.
//
// EXPIRES 2026-10-31. CiTestInventoryTest FAILS once that date passes, which is the point: a
// quarantine with no expiry is a deletion with extra steps. On that date, fix or delete them.
//
//   BalanceValueHelperTest  (3) IllegalArgumentException, "Invalid asset unit length: 29"
//   AddressUtilTest         (2) expected: not <null>
//   MpfTreeServiceTest      (6) Mockito Wanted-but-not-invoked + UnnecessaryStubbingException
ext.ciQuarantinedTests = [
		'BalanceValueHelperTest',
		'AddressUtilTest',
		'MpfTreeServiceTest',
]
ext.ciQuarantineExpiry = '2026-10-31'

// Headroom below the 133 tests the allowlist matched on 2026-10-01.
ext.CI_TEST_FLOOR = 110

tasks.register('ciTest', Test) {
	group = 'verification'
	description = 'Offline tests that are safe to run in CI (allowlist; never submits transactions).'
	useJUnitPlatform()
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	outputs.upToDateWhen { false }   // a green "UP-TO-DATE" that ran nothing is the trap this repo already has
	filter {
		ciTestPatterns.each { includeTestsMatching it }
		failOnNoMatchingTests = true
	}
	testLogging {
		events 'failed'
		exceptionFormat = 'short'
	}

	// ⛔ PRINT THE COUNT. On success Gradle prints nothing at all, so a green step proved only
	// that the task did not fail — which is indistinguishable from a filter that matched nothing
	// and a task that ran zero tests. `failOnNoMatchingTests` guards the empty case, but the
	// number is what a human reading the CI log can actually check, and it is what was asked for.
	afterSuite { desc, result ->
		if (desc.parent == null) {
			logger.lifecycle("\nciTest: ${result.testCount} tests EXECUTED, "
					+ "${result.failedTestCount} failed, ${result.skippedTestCount} skipped "
					+ "(result: ${result.resultType})")
			// ⛔ A FLOOR, NOT JUST NON-ZERO. Zero is the obvious failure; the dangerous one is a
			// SMALL number. If 'org.cardanofoundation.cip113.offline.*' stops matching — a package
			// rename, a moved class — the task still runs the handful of individually named
			// classes, reports SUCCESS, and nothing says that a hundred tests vanished.
			// `failOnNoMatchingTests` cannot see this either, because tests DID match.
			//
			// Set with headroom below the current count so legitimately deleting a test does not
			// redden CI; raise it when the suite grows substantially.
			if (result.testCount < CI_TEST_FLOOR) {
				throw new GradleException("ciTest ran only ${result.testCount} tests, below the "
						+ "floor of ${CI_TEST_FLOOR}. Either a large number of tests stopped being "
						+ "matched by ext.ciTestPatterns — check that the offline package pattern "
						+ "still resolves — or the suite shrank on purpose, in which case lower the "
						+ "floor deliberately. A filter that matches a FEW tests still reports "
						+ "SUCCESS, which is why non-zero is not a sufficient check.")
			}
		}
	}
}

tasks.named('test') {
	useJUnitPlatform()
	// NOTE: this task used to declare two vendored contract trees (../core-contracts and
	// ../modules/rwa-token) as inputs, so that editing an Aiken file invalidated the
	// test task. Those trees are gone — only the compiled blueprints are shipped now, and
	// they live in src/main/resources, which is already an implicit input. See
	// docs/CONTRACTS.md and ContractBlueprintPinTest.

	// Gradle discards the test JVM's stdout/stderr, so log.info and System.out
	// from a test are invisible by default — including the deployment test's
	// BootstrapParams and derived script hashes. Opt in per-run:
	//
	//   ./gradlew test --tests '*Foo*' -PtestLogs
	//
	// Left off by default on purpose: the full suite is 116 tests and streaming
	// every one of them buries the result.
	if (project.hasProperty('testLogs')) {
		testLogging {
			showStandardStreams = true
			events 'passed', 'skipped', 'failed'
			exceptionFormat = 'full'
		}
	}
}

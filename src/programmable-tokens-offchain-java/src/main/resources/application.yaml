spring:
  flyway:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cip113}
    user: ${DB_USERNAME:cardano}
    password: ${DB_PASSWORD:password}
    schemas: ${DB_SCHEMA:public}
    locations:
      - classpath:db/store/{vendor}
      - classpath:db/migration
    out-of-order: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cip113}
    username: ${DB_USERNAME:cardano}
    password: ${DB_PASSWORD:password}

network: mainnet

wallet:
  mnemonic: ""

blockfrost:
  url: https://cardano-mainnet.blockfrost.io/api/v0/
  key: ""

koios:
  url: ${KOIOS_URL:https://api.koios.rest/api/v1/}

store:
  cardano:
    host: backbone.mainnet.cardanofoundation.org
    port: 3001
    protocol-magic: 764824073
    # Start from the block that minted the ref input for the contract
    sync-start-blockhash: 586ead1770fc2a59021b824bc0d65bf1d6060585384f257971204d5925f054c2
    sync-start-slot: 154984561
    keep-alive-interval: 1000

# Modules hidden from the API and the issuance wizard. The contracts stay
# vendored and already-issued tokens keep working; this only removes them as
# choices for NEW tokens.
modules:
  disabled: ${MODULES_DISABLED:kyc,kyc-extended}

# CIP-171 script-provenance lookups (uplc.link). Used only to LABEL a token whose module
# cannot be derived locally -- never to authorise anything. Scoped by DOMAIN, not by a query
# parameter: a lookup against the wrong host answers 404 rather than erroring, so each network
# profile below sets its own base-url and leaves this default empty (= disabled).
uplc-link:
  enabled: ${UPLC_LINK_ENABLED:true}
  # The unprofiled document IS mainnet -- `network: mainnet` above, and there is no separate
  # mainnet profile -- so this default is mainnet's API host. Profiles below override it.
  # Declared ONCE: a second `uplc-link:` key in this document is not an override, it is a
  # DuplicateKeyException at startup.
  base-url: ${UPLC_LINK_BASE_URL:https://api.uplc.link}
  timeout-ms: ${UPLC_LINK_TIMEOUT_MS:4000}

apiPrefix: /api/v1

keri:
  enabled: ${KERI_ENABLED:true}
  url: ${KERI_URL:http://localhost:3901}
  booturl: ${KERI_BOOT_URL:http://localhost:3903}
  identifier:
    bran: ${KERI_BRAN:0ADF2TpptgqcDE5IQUF1H}
    name: ${KERI_IDENTIFIER_NAME:identity}
    role: agent
    registry-name: kyc-registry
  schema:
    base-url: https://cred-issuance.demo.idw-sandboxes.cf-deployments.org/oobi/
    schemas:
      USER:
        said: EL9oOWU_7zQn_rD--Xsgi3giCWnFDaNvFMUGTOZx1ARO
        label: "Basic KYC"
      INSTITUTIONAL:
        said: ${KERI_SCHEMA_INSTITUTIONAL_SAID:ENPXp1vQzRF6JwIuS-mp2U8Uf1MoADoP_GqQ62VsDZWY}
        label: "Institutional KYC"
      VLEI:
        said: ${KERI_SCHEMA_VLEI_SAID:ENPXp1vQzRF6JwIuS-mp2U8Uf1MoADoP_GqQ62VsDZWY}
        label: "vLEI Credential"
  signing-mnemonic: ${KERI_SIGNING_MNEMONIC:nest wild farm beyond decide arm chuckle home raven card parrot nothing crazy casino hub broken scan height marine movie gloom village common off}
  kyc-proof-validity-days: ${KERI_PROOF_VALIDITY_DAYS:30}

# kyc-extended autonomous root-sync job. Signing reuses keri.signing-mnemonic
# (which carries full TEL authority — future hardening would scope this key to
# root updates only via a separate root_hash_updater_pkh in the global state).
kycExtended:
  enabled: ${KYC_EXTENDED_ENABLED:true}
  rootHashUpdateIntervalSeconds: ${KYC_EXTENDED_ROOT_UPDATE_INTERVAL_SECONDS:30}
  memberValidityDays: ${KYC_EXTENDED_MEMBER_VALIDITY_DAYS:30}
  postInsertSyncDelayMs: ${KYC_EXTENDED_POST_INSERT_SYNC_DELAY_MS:5000}
  postInsertCoalesceMs: ${KYC_EXTENDED_POST_INSERT_COALESCE_MS:30000}

# rwa-token autonomous root-sync job. Same admin-signing-key reuse caveat
# as the kyc-extended block above.
rwaToken:
  enabled: ${SECURITY_TOKEN_ENABLED:true}
  rootHashUpdateIntervalSeconds: ${SECURITY_TOKEN_ROOT_UPDATE_INTERVAL_SECONDS:30}
  memberValidityDays: ${SECURITY_TOKEN_MEMBER_VALIDITY_DAYS:30}
  postInsertSyncDelayMs: ${SECURITY_TOKEN_POST_INSERT_SYNC_DELAY_MS:5000}

# Start with no CIP-113 deployment recorded, to check the database, the migrations and the
# node peer BEFORE a ceremony spends one-shot seeds that cannot be recovered. The service
# still REFUSES every protocol operation individually; this only keeps the process up.
#
# ⚑ Declared here so the env var has a NAME THIS FILE STATES. Relaxed binding does reach the
# @Value without this block, but only via a spelling nothing in the repo writes down, and the
# chart that has to set it should not have to infer it. See ProtocolBootstrapService.
cip113:
  allow-no-deployment: ${CIP113_ALLOW_NO_DEPLOYMENT:false}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

---
spring:
  config:
    activate:
      on-profile: preprod

network: preprod
uplc-link:
  base-url: ${UPLC_LINK_BASE_URL:https://preprod-api.uplc.link}

wallet:
  mnemonic: ""

blockfrost:
  url: https://cardano-preprod.blockfrost.io/api/v0/

koios:
  url: ${KOIOS_URL:https://preprod.koios.rest/api/v1/}

store:
  cardano:
    host: ""
    port: 0
    protocol-magic: 1
    sync-start-blockhash: ""
    sync-start-slot: 0

---
spring:
  config:
    activate:
      on-profile: preview

network: preview
uplc-link:
  base-url: ${UPLC_LINK_BASE_URL:https://preview-api.uplc.link}

wallet:
  mnemonic: ""

# Sole supported Preview deployment: CIP-113 0.0.1 / bootstrap schema 3.
# ⛔ NO PREVIEW INSTANCE EXISTS YET. alpha.5 moves eight of twelve script hashes, so the
# alpha.4 instance this pointed at is abandoned, not upgraded; protocol-bootstraps-preview.json
# is an empty array until the redeploy. The backend fails closed on an empty file, which is
# the intended state — it must not serve an instance that is no longer current.
# The explicit pin prevents an operator typo or stale environment value from silently
# selecting a different protocol instance.
programmable:
  token:
    default:
      txHash: "8314e59f3e240ba89fb7f7037cf3094307132ede0ac3a1d2515a09a9cc333bc8"

blockfrost:
  url: https://cardano-preview.blockfrost.io/api/v0/

koios:
  url: ${KOIOS_URL:https://preview.koios.rest/api/v1/}

# Off by default on preview: KERI is only needed by the kyc modules, both of which are
# in modules.disabled, and its client otherwise dials localhost:3901 on every boot of a
# laptop that is not running a KERI agent. Still overridable via KERI_ENABLED=true.
keri:
  enabled: ${KERI_ENABLED:false}

store:
  cardano:
    # A real sync target. This was host:"" / port:0, which is not "sync from genesis" — it is
    # no peer at all, and it is why running the preview profile directly never indexed
    # anything. preview-node.play.dev.cardano.org is the public preview relay
    # (preview-node.world.dev.cardano.org is a CNAME onto it); there is no CF-operated
    # preview backbone to match the mainnet default above.
    host: ${STORE_CARDANO_HOST:preview-node.play.dev.cardano.org}
    port: ${STORE_CARDANO_PORT:3001}
    protocol-magic: 2
    # Intersect at the block immediately BEFORE the earliest transaction of THIS deployment,
    # so the first block applied is the first one that matters. The alpha.4 Preview deployment's
    # four anchors, measured on chain: seed ad5ae742… (block 4654021 / slot 122504666), upgrade
    # multisig UTxO 81350dcf… (4654022), bootstrap/params 8314e59f… (4654024) and the reference
    # scripts 9da25ead… (4654027), all epoch 1417. Block 4654020 precedes all four.
    #
    # This block and its comment previously described an EARLIER deployment, seeded in block
    # 4608706 / epoch 1402 -- 45,315 blocks and fifteen epochs before alpha.4. That was wasteful
    # rather than wrong (it still reached the deployment) but it is the kind of stale value that
    # reads as deliberate. Err EARLY if this must be changed again: too early costs only sync
    # time, while too late means the params UTxO is never indexed, no deployment resolves, and
    # every operation fails with a message that points at configuration rather than at the
    # sync window. Preview's chain starts in 2022, so genesis is hours of indexing nothing.
    #
    # These two MUST stay set. The unprofiled document at the top of this file carries a
    # MAINNET sync start, and Spring merges it into every profile — so clearing these does not
    # mean "from genesis", it means "from a mainnet block hash under protocol magic 2", which
    # yaci-store's InitService rejects with "Shelley start point is not configured properly".
    sync-start-blockhash: ${STORE_SYNC_START_BLOCKHASH:d5568035360998efe792f6415750096b6fdc02836747e6d16ceee7714c3f584a}
    sync-start-slot: ${STORE_SYNC_START_SLOT:122504546}

---
spring:
  config:
    activate:
      on-profile: devnet

network: devnet
# No registry for a local devnet. Empty disables lookups; without this, devnet would inherit
# mainnet's host from the unprofiled document and quietly ask it about devnet scripts.
uplc-link:
  base-url: ${UPLC_LINK_BASE_URL:}

wallet:
  mnemonic: ""

# programmable.token.default.txHash: "7fab961bbf52d95c475b3ff8b994dcc9334ef3fb4d752b875c0d426eeb391cc8"

blockfrost:
  url: http://localhost:8081/api/v1/

koios:
  url: ${KOIOS_URL:https://preview.koios.rest/api/v1/}

store:
  cardano:
    # The devkit's node-to-node port, as published by the yaci-cli container. Empty host / port 0
    # left the store with nowhere to connect when running the backend directly (the docker
    # compose file injects STORE_CARDANO_HOST/PORT, so only a local `bootRun` was affected).
    # Environment variables still win over these, via Spring's relaxed binding.
    host: localhost
    port: 3001
    protocol-magic: 42
    # REQUIRED, even though they look like no-ops. The unprofiled document at the top of this
    # file sets a MAINNET sync start (block 586ead17… at slot 154984561), and Spring merges
    # that document into every profile — so without these overrides a devnet inherits a
    # mainnet block hash. yaci-store's InitService then treats it as a custom start point,
    # cannot resolve a Shelley start for protocol magic 42, and refuses to start with
    # "Shelley start point is not configured properly". Empty/zero means "sync from genesis",
    # which is what a devnet wants. preview and preprod override the same pair for the same
    # reason.
    sync-start-blockhash: ""
    sync-start-slot: 0
    byron-genesis-file: classpath:/devkit/byron-genesis.json
    shelley-genesis-file: classpath:/devkit/shelley-genesis.json
    alonzo-genesis-file: classpath:/devkit/alonzo-genesis.json
    conway-genesis-file: classpath:/devkit/conway-genesis.json
